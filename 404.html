<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Katalog Produk</title>
<script>
  // GitHub Pages hanya punya index.html, jadi alamat seperti /Katalog-Produk/bags/backpack
  // dialihkan ke /Katalog-Produk/?r=bags/backpack. Katalog lalu mengembalikan alamat aslinya.
  (function(){
    var l = window.location;
    var seg = l.pathname.split('/').filter(Boolean);
    var onPages = /\.github\.io$/i.test(l.hostname);
    var root = onPages && seg.length ? '/' + seg[0] + '/' : '/';
    var rest = l.pathname.indexOf(root) === 0 ? l.pathname.slice(root.length) : l.pathname.replace(/^\/+/, '');
    var extra = l.search ? '&' + l.search.slice(1) : '';
    l.replace(root + '?r=' + encodeURIComponent(rest) + extra + l.hash);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#F3F5FA;color:#5A6482;}
</style>
</head>
<body>
  <p>Membuka katalog&hellip;</p>
</body>
</html>
